<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Illustration d'une ville avec des bâtiments et une silhouette de policier municipal">
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#001a3d"/>
      <stop offset="1" stop-color="#003b7a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#ciel)"/>
  <!-- étoiles discrètes -->
  <g fill="#ffffff" opacity=".35">
    <circle cx="120" cy="70" r="2"/><circle cx="260" cy="130" r="1.5"/><circle cx="420" cy="60" r="2"/>
    <circle cx="610" cy="90" r="1.5"/><circle cx="800" cy="50" r="2"/><circle cx="980" cy="120" r="1.5"/>
    <circle cx="1100" cy="70" r="2"/>
  </g>
  <!-- Hôtel de ville avec dôme et drapeau tricolore -->
  <g fill="#0b3d7a">
    <rect x="660" y="300" width="260" height="300"/>
    <rect x="700" y="230" width="180" height="70"/>
    <path d="M690 230 Q790 150 890 230 Z"/>
    <rect x="786" y="110" width="8" height="120"/>
  </g>
  <g>
    <rect x="800" y="110" width="26" height="16" fill="#0055A4"/>
    <rect x="826" y="110" width="26" height="16" fill="#ffffff"/>
    <rect x="852" y="110" width="26" height="16" fill="#CE1126"/>
  </g>
  <g fill="#f5c542" opacity=".75">
    <rect x="684" y="330" width="22" height="30"/><rect x="724" y="330" width="22" height="30"/>
    <rect x="764" y="330" width="22" height="30"/><rect x="804" y="330" width="22" height="30"/>
    <rect x="844" y="330" width="22" height="30"/><rect x="884" y="330" width="22" height="30"/>
    <rect x="684" y="400" width="22" height="30"/><rect x="724" y="400" width="22" height="30"/>
    <rect x="764" y="400" width="22" height="30"/><rect x="804" y="400" width="22" height="30"/>
    <rect x="844" y="400" width="22" height="30"/><rect x="884" y="400" width="22" height="30"/>
    <rect x="770" y="500" width="50" height="100" fill="#001a3d"/>
  </g>
  <!-- Immeubles -->
  <g fill="#00234f">
    <rect x="0" y="380" width="150" height="220"/>
    <rect x="160" y="320" width="120" height="280"/>
    <rect x="290" y="350" width="140" height="250"/>
    <rect x="440" y="290" width="110" height="310"/>
    <rect x="560" y="390" width="90" height="210"/>
    <rect x="940" y="340" width="130" height="260"/>
    <rect x="1080" y="300" width="120" height="300"/>
  </g>
  <g fill="#f5c542" opacity=".5">
    <rect x="20" y="410" width="18" height="24"/><rect x="60" y="410" width="18" height="24"/><rect x="100" y="410" width="18" height="24"/>
    <rect x="20" y="460" width="18" height="24"/><rect x="60" y="460" width="18" height="24"/><rect x="100" y="460" width="18" height="24"/>
    <rect x="180" y="350" width="18" height="24"/><rect x="220" y="350" width="18" height="24"/>
    <rect x="180" y="400" width="18" height="24"/><rect x="220" y="400" width="18" height="24"/>
    <rect x="310" y="380" width="18" height="24"/><rect x="350" y="380" width="18" height="24"/><rect x="390" y="380" width="18" height="24"/>
    <rect x="310" y="430" width="18" height="24"/><rect x="350" y="430" width="18" height="24"/><rect x="390" y="430" width="18" height="24"/>
    <rect x="460" y="320" width="18" height="24"/><rect x="500" y="320" width="18" height="24"/>
    <rect x="460" y="370" width="18" height="24"/><rect x="500" y="370" width="18" height="24"/>
    <rect x="960" y="370" width="18" height="24"/><rect x="1000" y="370" width="18" height="24"/><rect x="1040" y="370" width="18" height="24"/>
    <rect x="960" y="420" width="18" height="24"/><rect x="1000" y="420" width="18" height="24"/><rect x="1040" y="420" width="18" height="24"/>
    <rect x="1100" y="330" width="18" height="24"/><rect x="1140" y="330" width="18" height="24"/>
    <rect x="1100" y="380" width="18" height="24"/><rect x="1140" y="380" width="18" height="24"/>
  </g>
  <!-- Silhouette de policier municipal (plan d'ensemble, à droite) -->
  <g fill="#001a3d" transform="translate(470 210)">
    <!-- casquette -->
    <rect x="28" y="0" width="64" height="22" rx="8"/>
    <rect x="22" y="18" width="76" height="8" rx="3"/>
    <!-- visage -->
    <ellipse cx="60" cy="48" rx="24" ry="28"/>
    <!-- épaules et torse -->
    <path d="M10 130 Q12 84 60 80 Q108 84 110 130 L110 220 L10 220 Z"/>
    <!-- ceinture -->
    <rect x="10" y="168" width="100" height="10" fill="#f5c542" opacity=".6"/>
    <!-- insigne -->
    <path d="M60 100 l7 7 l-7 7 l-7 -7 z" fill="#f5c542" opacity=".8"/>
  </g>
  <!-- Bandeau tricolore en bas -->
  <g>
    <rect x="0" y="584" width="400" height="16" fill="#0055A4"/>
    <rect x="400" y="584" width="400" height="16" fill="#ffffff"/>
    <rect x="800" y="584" width="400" height="16" fill="#CE1126"/>
  </g>
</svg>
