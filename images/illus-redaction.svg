<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Illustration d’un ordinateur portable affichant un rapport, avec un stylo">
  <rect width="240" height="160" rx="12" fill="#eef4fb"/>
  <!-- écran -->
  <rect x="50" y="22" width="130" height="90" rx="8" fill="#0b1f3a"/>
  <rect x="58" y="30" width="114" height="74" rx="4" fill="#ffffff"/>
  <rect x="68" y="42" width="60" height="7" rx="2" fill="#0b3d7a"/>
  <g fill="#c9d6e8">
    <rect x="68" y="58" width="94" height="5" rx="2"/><rect x="68" y="70" width="86" height="5" rx="2"/>
    <rect x="68" y="82" width="94" height="5" rx="2"/><rect x="68" y="94" width="60" height="5" rx="2"/>
  </g>
  <rect x="150" y="88" width="14" height="10" fill="#2e8b57"/>
